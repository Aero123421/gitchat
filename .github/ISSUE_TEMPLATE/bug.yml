name: Bug
description: Something else does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: gitchat version and browser
      placeholder: gitchat 0.1.0, Chrome 132 (en)
