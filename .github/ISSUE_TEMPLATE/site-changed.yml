name: A chat site changed
description: gitchat stopped reading ChatGPT, Claude or Gemini correctly
labels: [site-adapter]
body:
  - type: dropdown
    id: site
    attributes:
      label: Site
      options: [ChatGPT, ChatGPT (Work mode), Claude, Gemini]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: e.g. "messages are missing", "the widget never shows thinking", "init stops early", "math is plain text".
    validations:
      required: true
  - type: textarea
    id: dom
    attributes:
      label: HTML of one message (optional)
      description: Right-click the message → Inspect → copy the element. Remove names, emails and any private text first.
      render: html
  - type: input
    id: version
    attributes:
      label: gitchat version and browser
      placeholder: gitchat 0.1.0, Chrome 132 (ja)
